[project]
name = "eye-gaze-backend"
version = "0.1.0"
description = "Native Python MediaPipe FaceLandmarker and V4L2 MJPG backend for Eye Gaze HUD"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mediapipe==1.2.3",
    "opencv-contrib-python==5.1.0.95",
    "numpy==2.4.6",
    "websockets>=14.0,<18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.11"
mypy_path = ".."
strict = true
warn_unused_ignores = true
